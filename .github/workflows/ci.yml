name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: go build -o mcp-snooze.exe .
      - name: Build on Unix
        if: runner.os != 'Windows'
        run: go build -o mcp-snooze .
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Run proxy black-box tests
        if: runner.os != 'Windows'
        run: python3 tests/test_proxy.py
      - name: Run harness black-box tests
        if: runner.os != 'Windows'
        run: python3 tests/test_harness.py
